<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAB308"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Rounded card background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" fill="none" stroke="url(#ia)" stroke-width="1.5" opacity="0.55"/>

  <!-- Letter I (bold serif-style block) -->
  <path d="M 13 16 H 25 V 21 H 21.5 V 43 H 25 V 48 H 13 V 43 H 16.5 V 21 H 13 Z"
        fill="url(#ia)"/>

  <!-- Letter A (clean triangular monogram) -->
  <path d="M 28 48 L 37 16 L 43 16 L 52 48 L 46.5 48 L 44.7 40.5 L 35.3 40.5 L 33.5 48 Z M 36.4 35.5 L 43.6 35.5 L 40 22 Z"
        fill="url(#ia)"
